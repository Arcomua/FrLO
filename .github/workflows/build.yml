name: Build FrLO
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build Modrinth pack
        run: python -m frlo_release build --formats modrinth
      - uses: actions/upload-artifact@v4
        with:
          name: FrLO-build
          path: dist/
          if-no-files-found: error
